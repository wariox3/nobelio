openapi: 3.0.3
info:
  title: RedEDoc — API de facturación electrónica DIAN
  version: 1.0.0
  description: |-
    Emisión de documentos electrónicos ante la DIAN (Colombia): factura, notas, documento soporte, documento equivalente P.O.S. y nómina.

    **Autenticación.** Una sola credencial, en cabecera:

    ```
    Authorization: Api-Key <prefijo>.<secreto>
    ```

    La entrega quien administra la plataforma y se muestra **una sola vez**. Alcanza los emisores de la persona a cuyo nombre se creó: lo ajeno no aparece en los listados y responde 404. No hay `Bearer`.

    **Errores.** Todos comparten cuerpo: `detail` con el mensaje y `errores` con los fallos por campo cuando los hay.

    **Límites de peticiones.** Hay un tope por credencial, y los catálogos —que se leen sin credencial— lo tienen por IP. Al superarlo la respuesta es 429 con la cabecera `Retry-After`.

    **Catálogos.** `/api/catalogos/…` es de solo lectura y no pide credencial: son las listas oficiales de la DIAN, y sus códigos son lo que el resto de la API espera recibir.
paths:
  /api/catalogos/departamento/:
    get:
      operationId: catalogos_departamento_list
      description: Base de solo lectura para catálogos simples (código + nombre).
      parameters:
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - catalogos
      security:
      - LlaveApi: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedElementoCatalogoList'
          description: ''
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
