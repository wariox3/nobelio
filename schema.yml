    DocumentoErrorTipoEnum:
      enum:
      - rechazo
      - notificacion
      - otro
      type: string
      description: |-
        * `rechazo` - Rechazo
        * `notificacion` - Notificación
        * `otro` - Otro
    DocumentoLista:
      type: object
      description: |-
        Versión para el listado: sin las líneas anidadas y, del estado, solo el nombre.

        De los errores va solo cuántos son: para pintar la lista basta saber que un
        documento tiene rechazos, y el detalle es quien los explica. Además el
        ViewSet lo resuelve anotando un ``COUNT``, así que ni siquiera se traen las
        filas de error.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        documento_tipo:
          type: integer
          title: Tipo de documento
        documento_tipo_nombre:
          type: string
          readOnly: true
        estado:
          type: integer
          readOnly: true
        estado_nombre:
          type: string
          readOnly: true
        emisor:
          type: integer
        resolucion:
          type: integer
          nullable: true
          title: Resolución
        resolucion_numero:
          type: string
          readOnly: true
        adquiriente:
          allOf:
          - $ref: '#/components/schemas/Adquiriente'
          readOnly: true
        prefijo:
          type: string
          maxLength: 10
        consecutivo:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        numero:
          type: string
          title: Número
          description: Número del documento (cbc:ID). Si se omite, se arma como prefijo
            + consecutivo.
          maxLength: 30
        cufe_cude:
          type: string
          readOnly: true
          title: CUFE/CUDE
          description: Hash SHA-384 (96 hex). CUFE en facturas, CUDE en notas/soporte.
        track_id:
          type: string
          readOnly: true
          title: Track id DIAN
          description: Identificador del envío (ZipKey del Set de Pruebas o trackId),
            para consultar el estado en la DIAN.
        envio:
          allOf:
          - $ref: '#/components/schemas/EnvioDocumentoEnum'
          readOnly: true
          title: Operación de envío
          description: |-
            Con qué operación se envió a la DIAN. Decide cómo se consulta después el estado: GetStatusZip para el Set de Pruebas (el track_id es un ZipKey) y GetStatus para el envío síncrono. Vacío mientras no se haya enviado.

            * `test_set` - Set de Pruebas (SendTestSetAsync)
            * `bill_sync` - Síncrono (SendBillSync)
        ambiente:
          allOf:
          - $ref: '#/components/schemas/AmbienteEnum'
          readOnly: true
          title: Ambiente DIAN
          description: |-
            ProfileExecutionID del XML: 1 producción, 2 habilitación. Se hereda del emisor al crear y se sella al firmar; no lo decide el ajuste del servidor.

            * `1` - Producción
            * `2` - Habilitación
        fecha_validacion:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Fecha y hora de validación DIAN
          description: Momento en que la DIAN aceptó el documento.
        notificado:
          type: boolean
          readOnly: true
          title: Notificado al adquiriente
          description: Si ya se le entregó el documento al comprador. Lo marca la
            acción `notificar`; mientras el envío por correo no exista, significa
            que el paquete se armó y se entregó a quien lo pidió.
        concepto_correccion:
          type: string
          title: Concepto de corrección
          description: 'ResponseCode del DiscrepancyResponse: por qué se corrige el
            documento referenciado. Los códigos válidos dependen del tipo de nota
            (ConceptoNotaCredito, ConceptoNotaDebito, ConceptoNotaAjuste). Vacío en
            lo que no es nota.'
          maxLength: 2
        fecha_vencimiento:
          type: string
          format: date
          nullable: true
          title: Fecha de vencimiento
          description: 'DueDate del XML: hasta cuándo hay plazo para pagar. La DIAN
            la exige cuando la forma de pago es a crédito; en contado sobra.'
        orden_compra:
          type: string
          title: Orden de compra
          description: Número de la orden de compra del adquiriente, si la hubo.
          maxLength: 100
        orden_compra_fecha:
          type: string
          format: date
          nullable: true
          title: Fecha de la orden de compra
        orden_compra_tipo:
          type: string
          title: Tipo de la orden de compra
          description: 'cbc:OrderTypeCode: qué clase de orden es (contrato, pedido…),
            según la codificación que use el comprador.'
          maxLength: 20
        orden_compra_documento:
          type: string
          title: Documento de la orden de compra
          description: 'cac:DocumentReference/cbc:ID: el soporte de la orden (contrato,
            acuerdo marco) cuando es distinto del número de la orden.'
          maxLength: 100
        fecha_emision:
          type: string
          format: date
          title: Fecha de emisión
          description: IssueDate del XML. Si se omite se toma la fecha de hoy, que
            es la única con la que se puede firmar (regla FAD09).
        hora_emision:
          type: string
          format: time
          title: Hora de emisión
          description: IssueTime del XML. Si se omite se toma la hora actual, y al
            firmar se reescribe con la hora de la firma.
        moneda:
          type: integer
        forma_pago:
          type: integer
          nullable: true
          title: Forma de pago
        medio_pago:
          type: integer
          nullable: true
          title: Medio de pago
        valor_bruto:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
          title: Valor bruto (sin impuestos)
          description: 'LineExtensionAmount: suma de las líneas.'
        total_impuestos:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
        total_descuentos:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          description: Descuentos globales del documento (no los de línea).
        descuentos_motivo:
          type: string
          title: Motivo de los descuentos
          description: cbc:AllowanceChargeReason del descuento global.
          maxLength: 255
        total_cargos:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        cargos_motivo:
          type: string
          title: Motivo de los cargos
          description: cbc:AllowanceChargeReason del cargo global.
          maxLength: 255
        total_a_pagar:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
          readOnly: true
          description: PayableAmount.
        documento_referencia:
          type: string
          format: uuid
          nullable: true
          title: Documento de referencia
        observaciones:
          type: string
        pos:
          allOf:
          - $ref: '#/components/schemas/DocumentoPOS'
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
        actualizado_en:
          type: string
          format: date-time
          readOnly: true
        total_errores:
          type: integer
          description: Usa la anotación del ViewSet; si no está, cuenta a mano.
          readOnly: true
      required:
      - actualizado_en
      - adquiriente
      - ambiente
      - consecutivo
      - creado_en
      - cufe_cude
      - documento_tipo
      - documento_tipo_nombre
      - emisor
      - envio
      - estado
      - estado_nombre
      - fecha_validacion
      - id
      - moneda
      - notificado
      - pos
      - prefijo
      - resolucion_numero
      - total_a_pagar
      - total_errores
      - total_impuestos
      - track_id
      - valor_bruto
    DocumentoPOS:
      type: object
      description: |-
        Va anidado en el documento, como el adquiriente.

        Alimenta dos de las tres extensiones obligatorias del P.O.S. (DEPD11 y
        DEPD21). La tercera, la del fabricante del software, sale de
        ``SoftwareDian`` y no se pide aquí: es constante para todos los tiquetes.

        La caja llega aquí y no por id de un maestro: el punto de venta conoce su
        placa, no nuestros identificadores internos, y así no hace falta darla de
        alta antes de vender.

        Los campos del comprador y el subtotal pueden omitirse; el constructor los
        toma del propio documento. No es que la DIAN los admita vacíos —los tres
        pares son de rechazo—, es que su valor ya está en el documento y pedirlo dos
        veces solo daría ocasión de que no coincidan.
      properties:
        caja_placa:
          type: string
          title: Placa de la caja
          description: Placa de inventario de la caja (par `PlacaCaja`).
          maxLength: 50
        caja_ubicacion:
          type: string
          title: Ubicación de la caja
          description: 'Dónde estaba la caja (par `UbicaciónCaja`, con tilde: es el
            literal que compara la DIAN).'
          maxLength: 255
        caja_tipo:
          type: string
          title: Tipo de caja
          description: Par `TipoCaja`. El anexo no da lista de valores; la ejemplificación
            oficial usa texto libre ('Caja de apoyo').
          maxLength: 100
        cajero:
          type: string
          description: Nombres y apellidos del cajero o vendedor (par `Cajero`).
          maxLength: 200
        codigo_venta:
          type: string
          title: Código de la venta
          description: Identificador interno de la transacción (par `CódigoVenta`,
            con tilde).
          maxLength: 50
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
          title: Subtotal de la venta
          description: Par `SubTotal`. Si se deja vacío se emite el `valor_bruto`
            del documento. Se admite informarlo aparte porque la ejemplificación oficial
            trae ahí un importe distinto del LineExtensionAmount y el anexo no aclara
            la diferencia.
        comprador_codigo:
          type: string
          title: Código del comprador
          description: Documento de identidad del comprador. Vacío emite el del adquiriente
            del documento.
          maxLength: 50
        comprador_nombres:
          type: string
          title: Nombres del comprador
          description: Vacío emite el nombre del adquiriente del documento.
          maxLength: 200
        comprador_puntos:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Puntos acumulados
          description: 'Puntos del programa de fidelización. Cero si no hay programa:
            el par es obligatorio y omitirlo es un rechazo.'
      required:
      - caja_placa
      - caja_tipo
      - caja_ubicacion
      - cajero
      - codigo_venta
