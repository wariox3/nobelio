components:
  schemas:
    Adquiriente:
      type: object
      description: 'Datos del receptor. No tiene endpoint propio: se piden en el documento.'
      properties:
        razon_social:
          type: string
          title: Razón social
          maxLength: 450
        primer_nombre:
          type: string
          maxLength: 100
        segundo_nombre:
          type: string
          maxLength: 100
        primer_apellido:
          type: string
          maxLength: 100
        segundo_apellido:
          type: string
          maxLength: 100
        tipo_identificacion:
          type: integer
          title: Tipo de identificación
        numero_identificacion:
          type: string
          title: Número de identificación
          description: Sin puntos, sin guiones y sin dígito de verificación.
          maxLength: 20
        digito_verificacion:
          type: string
          title: Dígito de verificación
          maxLength: 1
        tipo_organizacion:
          type: integer
          title: Tipo de organización
        responsabilidades:
          type: array
          items:
            type: integer
            title: Responsabilidades fiscales
          title: Responsabilidades fiscales
        pais:
          type: integer
          title: País
        departamento:
          type: integer
          nullable: true
        municipio:
          type: integer
          nullable: true
        direccion:
          type: string
          title: Dirección
          maxLength: 255
        codigo_postal:
          type: string
          title: Código postal
          description: cbc:PostalZone de las direcciones del XML.
          maxLength: 10
        telefono:
          type: string
          title: Teléfono
          maxLength: 50
        correo:
          title: Correo electrónico
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
      required:
      - codigo_postal
      - numero_identificacion
      - pais
      - razon_social
      - tipo_identificacion
      - tipo_organizacion
    AdquirienteRequest:
