              $ref: '#/components/schemas/NominaCrearRequest'
        required: true
      security:
      - LlaveApi: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NominaCrear'
          description: ''
        '401':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
